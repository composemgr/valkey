# nginx proxy address - http://172.17.0.1:64381

name: valkey
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  db:
    image: valkey/valkey:latest
    container_name: valkey
    hostname: valkey
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: valkey
      VALKEY_EXTRA_FLAGS: --save 60 1 --loglevel warning --requirepass ${DB_ADMIN_PASS:-replace-with-a-random-password}
    ports:
      - '6379:6379'
    volumes:
      - './volumes/db/valkey/valkey:/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - valkey

  admin:
    image: erikdubbelboer/phpredisadmin:1
    container_name: valkey-admin
    hostname: valkey-admin
    restart: always
    pull_policy: always
    tty: true
    stdin_open: true
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: valkey-admin
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      REDIS_1_NAME: valkey
      REDIS_1_HOST: valkey
      REDIS_1_AUTH: ${DB_ADMIN_PASS:-replace-with-a-random-password}
    ports:
      - '172.17.0.1:64381:80'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - valkey

networks:
  valkey:
    name: valkey
    external: false
